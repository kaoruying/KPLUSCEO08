<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>K PLUS CEO講堂｜課後回饋</title>

  <style>
    :root {
      --navy: #002A6E;
      --blue: #005B88;
      --orange: #F4510B;
      --gold: #C99A3D;
      --ink: #172033;
      --muted: #667085;
      --line: #DDE5F0;
      --white: #FFFFFF;
      --success: #18794E;
      --danger: #B42318;
      --shadow: 0 20px 55px rgba(0, 42, 110, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 8px;
      font-family:
        "Noto Sans TC", "PingFang TC", "Microsoft JhengHei",
        system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(0, 91, 136, 0.12), transparent 30%),
        radial-gradient(circle at 95% 12%, rgba(244, 81, 11, 0.10), transparent 25%),
        linear-gradient(180deg, #F7FAFE 0%, #EEF4FB 100%);
    }

    .page {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .card {
      overflow: hidden;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(0, 42, 110, 0.08);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .brand-bar {
      height: 7px;
      background: linear-gradient(
        90deg,
        var(--navy) 0 58%,
        var(--orange) 58% 75%,
        var(--gold) 75%
      );
    }

    .content {
      padding: 20px 16px 24px;
    }

    .brand {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand-name {
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .brand-partner {
      max-width: 145px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.4;
      text-align: right;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: 28px;
      line-height: 1.25;
    }

    .lead {
      margin: 10px 0 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .gift-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      padding: 13px 15px;
      border: 1px solid rgba(201, 154, 61, 0.35);
      border-radius: 15px;
      background: linear-gradient(135deg, #FFF9EC, #FFFFFF);
    }

    .gift-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border-radius: 12px;
      background: #FFF0C9;
      font-size: 21px;
    }

    .gift-preview strong {
      color: #7A5714;
      font-size: 15px;
      line-height: 1.45;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 24px 0 13px;
      color: var(--navy);
      font-size: 17px;
      font-weight: 900;
    }

    .section-title::before {
      content: "";
      width: 5px;
      height: 20px;
      border-radius: 99px;
      background: var(--orange);
    }

    .field {
      margin-bottom: 18px;
    }

    .question {
      display: block;
      margin-bottom: 9px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.55;
    }

    .required {
      margin-left: 4px;
      color: var(--orange);
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 13px;
      background: var(--white);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"],
    select {
      height: 56px;
      padding: 0 15px;
    }

    select {
      color: var(--ink);
      background-color: var(--white);
    }

    select:disabled {
      color: #98A2B3;
      background-color: #F2F4F7;
      cursor: not-allowed;
    }

    textarea {
      min-height: 112px;
      padding: 14px 15px;
      line-height: 1.6;
      resize: vertical;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(0, 91, 136, 0.10);
    }

    fieldset {
      margin: 0;
      padding: 0;
      border: 0;
    }

    .rating {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .rating > div:first-child {
      grid-column: 1 / -1;
    }

    .rating > div:last-child {
      grid-column: auto;
    }

    .rating input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .rating label {
      display: grid;
      place-items: center;
      min-height: 62px;
      padding: 10px 6px;
      border: 1.5px solid var(--line);
      border-radius: 13px;
      background: var(--white);
      color: #344054;
      cursor: pointer;
      touch-action: manipulation;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.35;
    }

    .rating input:checked + label {
      border-color: var(--navy);
      background: var(--navy);
      color: var(--white);
      box-shadow: 0 8px 18px rgba(0, 42, 110, 0.18);
    }

    .followup-field {
      margin-top: 14px;
      padding: 16px;
      border: 1.5px solid rgba(244, 81, 11, 0.28);
      border-radius: 14px;
      background: #FFF8F4;
    }

    .followup-field[hidden] {
      display: none;
    }

    .followup-field .question {
      color: #8C3510;
    }

    .submit-btn {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 14px;
      color: var(--white);
      background: linear-gradient(110deg, var(--navy), var(--blue));
      box-shadow: 0 12px 25px rgba(0, 42, 110, 0.23);
      cursor: pointer;
      font: inherit;
      font-size: 17px;
      font-weight: 900;
    }

    .submit-btn:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .privacy {
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .status {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.55;
    }

    .status.error {
      display: block;
      color: var(--danger);
      background: #FFF1F0;
      border: 1px solid #F7C8C4;
    }

    .success {
      display: none;
      padding: 28px 18px;
      border: 1px solid rgba(24, 121, 78, 0.22);
      border-radius: 18px;
      background: linear-gradient(145deg, #F0FFF8, #FFFFFF);
      text-align: center;
    }

    .success.show {
      display: block;
      animation: rise 0.4s ease both;
    }

    .success-icon {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      margin: 0 auto 14px;
      border-radius: 50%;
      color: var(--white);
      background: var(--success);
      font-size: 38px;
      font-weight: 900;
    }

    .success h2 {
      margin: 0;
      color: var(--success);
      font-size: 29px;
    }

    .event-inline {
      margin-top: 18px;
      text-align: center;
    }

    .event-label {
      color: var(--orange);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.05em;
    }

    .event-date {
      margin-top: 11px;
      color: var(--navy);
      font-size: 19px;
      font-weight: 900;
    }

    .event-speaker {
      margin-top: 10px;
      color: var(--ink);
      font-size: 29px;
      font-weight: 900;
    }

    .event-title {
      margin-top: 4px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }

    .event-topic {
      display: inline-block;
      margin-top: 13px;
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--white);
      background: var(--navy);
      font-size: 15px;
      font-weight: 900;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 681px) {
      body {
        padding: 18px 10px 36px;
      }

      .content {
        padding: 28px 30px 34px;
      }

      .brand-name {
        font-size: 21px;
      }

      .brand-partner {
        max-width: none;
        font-size: 13px;
      }

      h1 {
        font-size: 38px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .rating {
        grid-template-columns: 1.35fr repeat(4, 1fr);
      }

      .rating > div:first-child,
      .rating > div:last-child {
        grid-column: auto;
      }
    }
  </style>
</head>

      document.getElementById("dissatisfactionReason");
    const dissatisfactionReasonLabel =
      document.getElementById("dissatisfactionReasonLabel");
    const satisfactionInputs =
      document.querySelectorAll('input[name="satisfaction"]');

    let isSubmitting = false;
    let currentRequestId = "";
    let pollTimer = null;
    let timeoutTimer = null;
    let pollCount = 0;

    function populateUnitManagers() {
      const region = regionCenter.value;
      const managers = REGION_MANAGERS[region] || [];

      unitManager.innerHTML = "";

      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = region
        ? "請選擇單位｜姓名"
        : "請先選擇區域中心";
      unitManager.appendChild(placeholder);

      managers.forEach(function (item) {
        const option = document.createElement("option");
        option.value = item;
        option.textContent = item;
        unitManager.appendChild(option);
      });

      unitManager.disabled = !region;
      unitManager.value = "";
    }

    regionCenter.addEventListener("change", populateUnitManagers);
    populateUnitManagers();

    function updateDissatisfactionReasonField() {
      const selected = document.querySelector(
        'input[name="satisfaction"]:checked'
      );

      const shouldShow =
        selected && (selected.value === "不滿意" || selected.value === "非常不滿意");

      dissatisfactionReasonField.hidden = !shouldShow;
      dissatisfactionReason.required = Boolean(shouldShow);

      if (shouldShow) {
        const level = selected.value;
        dissatisfactionReasonLabel.firstChild.textContent =
          "很抱歉，讓您有不好的感受，想請問您" +
          level +
          "的主要原因是什麼？ ";
      } else {
        dissatisfactionReason.value = "";
      }
    }

    satisfactionInputs.forEach(function (input) {
      input.addEventListener("change", function () {
        const wasHidden = dissatisfactionReasonField.hidden;
        updateDissatisfactionReasonField();

        if (wasHidden && !dissatisfactionReasonField.hidden) {
          window.setTimeout(function () {
            dissatisfactionReasonField.scrollIntoView({
              behavior: "smooth",
              block: "center"
            });
            dissatisfactionReason.focus();
          }, 120);
        }
      });
    });

    updateDissatisfactionReasonField();

    function createRequestId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }

      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
    }

    function clearTimers() {
      window.clearTimeout(pollTimer);
      window.clearTimeout(timeoutTimer);
    }

    function resetSubmittingState() {
      isSubmitting = false;
      clearTimers();
      submitBtn.disabled = false;
      submitBtn.textContent = "送出課後回饋";
    }

    function showError(message) {
      resetSubmittingState();
      statusBox.className = "status error";
      statusBox.textContent =
        message || "資料尚未成功送出，請稍後再試一次。";
    }

    function showSuccess() {
      isSubmitting = false;
      clearTimers();
      formPanel.style.display = "none";
      successPanel.classList.add("show");
      successPanel.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    function scheduleNextPoll() {
      if (!isSubmitting) return;

      pollTimer = window.setTimeout(function () {
        checkSubmissionStatus();
      }, 700);
    }

    function checkSubmissionStatus() {
      if (!isSubmitting || !currentRequestId) return;

      pollCount += 1;

      const callbackName = "__kplusStatusCallback";
      const oldScript = document.getElementById("kplusStatusScript");
      if (oldScript) oldScript.remove();

      window[callbackName] = function (data) {
        const script = document.getElementById("kplusStatusScript");
        if (script) script.remove();

        if (!isSubmitting || !data) return;

        if (data.requestId !== currentRequestId) {
          scheduleNextPoll();
          return;
        }

        if (data.status === "success") {
          showSuccess();
          return;
        }

        if (data.status === "error") {
          showError(data.message || "資料寫入失敗，請重新送出。");
          return;
        }

        scheduleNextPoll();
      };

      const script = document.createElement("script");
      script.id = "kplusStatusScript";
      script.src =
        WEB_APP_URL +
        "?mode=status" +
        "&requestId=" + encodeURIComponent(currentRequestId) +
        "&callback=" + encodeURIComponent(callbackName) +
        "&_=" + Date.now();

      script.onerror = function () {
        script.remove();
        scheduleNextPoll();
      };

      document.body.appendChild(script);
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      if (!form.reportValidity() || isSubmitting) {
        return;
      }

      currentRequestId = createRequestId();
      requestIdInput.value = currentRequestId;
      pollCount = 0;

      isSubmitting = true;
      statusBox.className = "status";
      statusBox.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "回饋送出中…";

      timeoutTimer = window.setTimeout(function () {
        if (isSubmitting) {
          showError("資料已送出，但確認時間較久，請重新整理後查看。");
        }
      }, 30000);

      HTMLFormElement.prototype.submit.call(form);
      scheduleNextPoll();
    });
  </script>
</body>
</html>
